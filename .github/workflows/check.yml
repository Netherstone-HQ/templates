name: Check templates

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check templates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/check-templates.mjs
